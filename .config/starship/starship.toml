"$schema" = 'https://starship.rs/config-schema.json'

# Prompt layout
add_newline = true
palette = 'fedora'
format = """
$directory\
$git_branch\
$git_status\
$php\
$golang\
$python\
$rust\
[](fg:cyan)\
$fill\
$cmd_duration\
$localip\
$kubernetes\
$os\
$line_break\
$character
"""

# Fedora-inspired colours
[palettes.fedora]
primary = '#3C6EB4'
secondary = '#294172'
blue = '#3C6EB4'

# Git module colors
git_primary = '#f14e32'
git_secondary = '#0388a6'

# Rust module color
rust_orange = '#D34516'

# PHP module color
php_dark = '#474A8A'

# Golang module color
golang_blue = '#00ADD8'

# Python module color
python_yellow = '#FFE873'
python_blue = '#4B8BBE'

# Kubernetes module color
kubernetes_blue = '#326CE5'

# Operating system module
[os]
disabled = false
format = """
[](fg:blue bg:yellow)\
[ $symbol ](bg:primary fg:white)\
[◢](bg:primary fg:secondary)\
[ $version ](bg:secondary fg:white)\
[◤](fg:secondary)\
"""

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = ""
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

# User and directory modules
[username]
show_always = true
format = '[ $user ]($style)'
style_user = 'yellow'

[directory]
format = """
[◢](fg:cyan)\
[ $path ](bg:cyan fg:black)\
([ $read_only ](bg:cyan fg:red))\
"""
truncation_length = 3
truncation_symbol = "󰉖 /"
truncate_to_repo = false
read_only = ''

[directory.substitutions]
Desktop = '󱂵 '
Documents = '󱧶 '
Downloads = '󰉍 '
Music = '󱍙 '
Pictures = '󰉏 '
Public = '󱞊 '
Templates = '󰉓 '
Videos = '󱧺 '
Projects = ' '

[fill]
symbol = '─'
style = 'secondary'

[cmd_duration]
style = 'fg:230'
format = ' 󱎫 [$duration ](fg:226)'

# Git module
[git_branch]
symbol = ""
format = """
[](fg:cyan bg:git_primary)\
[ $symbol $branch ](bg:git_primary fg:black)\
"""

[git_status]
format = """
[([◤](fg:git_primary bg:git_secondary)[$all_status$ahead_behind](bg:git_secondary fg:white)[](bg:git_primary fg:git_secondary))](fg:white)\
[](bg:cyan fg:git_primary)\
"""

# Language modules
[python]
symbol = ""
format = """
[](fg:cyan bg:python_yellow)\
[ $symbol( $version) ](bg:python_yellow fg:python_blue)\
[](fg:python_yellow bg:cyan)\
"""

[rust]
symbol = '󱘗'
format = """
[](fg:cyan bg:rust_orange)\
[ $symbol( $version) ](bg:rust_orange fg:white)\
[](fg:rust_orange bg:cyan)\
"""

[php]
symbol = ''
style = 'bg:#787CB5'
format = """
[](fg:cyan bg:php_dark)\
[[ $symbol( $version) ](bg:php_dark fg:white)]($style)\
[](fg:php_dark bg:cyan)\
"""

[golang]
symbol = "󰟓"
style = 'bg:#00ADD8'
format = """
[](fg:cyan bg:golang_blue)\
[[ $symbol( $version) ](bg:golang_blue fg:black)]($style)\
[](fg:golang_blue bg:cyan)\
"""

# Package information is not shown.
[package]
disabled = true

# Kubernetes
[kubernetes]
disabled = false
symbol = ''
style = 'fg:yellow bg:kubernetes_blue'
format = """
[](bg:yellow fg:kubernetes_blue)\
[ $symbol ](bg:kubernetes_blue fg:white)\
[$context ](bold $style)\
[◢](fg:yellow bg:kubernetes_blue)\
[ $namespace ](bg:yellow fg:kubernetes_blue)\
"""

[[kubernetes.contexts]]
context_pattern = ".*live.*"
style = 'fg:red bg:kubernetes_blue'

[[kubernetes.contexts]]
context_pattern = ".*staging.*"
style = 'fg:cyan bg:kubernetes_blue'

# Local network information
[localip]
ssh_only = false
disabled = false
format = """
[](fg:yellow)\
[  ( $localipv4) ](bg:yellow fg:black)\
"""
