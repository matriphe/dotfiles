# Inspiration: https://github.com/radleylewis/dotfiles/blob/master/.config/tmux/tmux.conf

# Terminal and colours
set -g default-terminal 'xterm-256color'
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set -as terminal-overrides ',alacritty*:Tc:sitm=\E[3m'

# Keep the default prefix and support Ctrl-B as a secondary prefix.
set-option -g prefix C-b
set-option -g prefix2 C-B

# Window and pane indexes
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# Clipboard and mouse behavior
set -g set-clipboard on
set -g mouse off
unbind-key -n C-S-m
unbind-key -n M-m
unbind-key -n C-M-m
bind-key m set-option -g mouse on \; display-message "Mouse mode on."
bind-key n set-option -g mouse off \; display-message "Mouse mode off."

# Open new windows and panes in the current directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

# Pane and window navigation.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n S-Left previous-window
bind -n S-Right next-window
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1
bind Space last-window

# Pane management.
bind x kill-pane
bind b break-pane
bind-key z resize-pane -Z
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind-key y set-window-option synchronize-panes \; display-message "synchronize mode toggled."

# Reload configuration.
unbind r
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display-message "󰑓 Config reloaded"

# Scrollback and status timing.
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5

# Vi-style copy mode.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Status line position and theme.
set-option -g status-position bottom
set -g status-style bg='#292522',fg='#ece1d7'
set -g message-style bg='#201c19',fg='#ebc06d'
set -g pane-border-style fg='#887a6e'
set -g pane-active-border-style fg='#ebc06d'
set -g mode-style bg='#ebc06d',fg='#292522'
set -g status-left-length 60
set -g status-left "#[fg=#ebc06d,bg=#292522]#[fg=#292522,bg=#ebc06d,bold] #S  #[fg=#ebc06d,bg=#292522]"
set -g status-right-length 120
set -g status-right "#[fg=#292522]#[fg=#ece1d7,bg=#292522] 󰥔 %H:%M #[fg=#ece1d7] #[fg=#887a6e]󰃭 %Y-%m-%d #[fg=#292522]#[fg=#d47766,bg=#292522] 󰅒 #(whoami)@#H "
set -g window-status-format "#[fg=#887a6e] 󰈚 #I:#W "
set -g window-status-current-format "#[fg=#ece1d7,bg=#201c19,bold] 󰈚 #I:#W #[default]"
set -g window-status-separator ""
