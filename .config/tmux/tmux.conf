# Inspiration: https://github.com/radleylewis/dotfiles/blob/master/.config/tmux/tmux.conf

# Terminal and colours
set -g default-terminal 'xterm-256color'
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set -as terminal-overrides ',alacritty*:Tc:sitm=\E[3m'

# Keep the default prefix and support Ctrl-B as a secondary prefix.
set-option -g prefix C-b
set-option -g prefix2 C-B

# Window and pane indexes
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# Clipboard and mouse behavior
set -g set-clipboard on
set -g mouse off
unbind-key -n C-S-m
unbind-key -n M-m
unbind-key -n C-M-m
bind-key m set-option -g mouse on \; display-message " 󰍽 Mouse mode on "
bind-key n set-option -g mouse off \; display-message " 󰍾 Mouse mode off "

# Open new windows and panes in the current directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

# Pane and window navigation.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n S-Left previous-window
bind -n S-Right next-window
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1
bind Space last-window

# Pane management.
bind x kill-pane
bind b break-pane
bind-key z resize-pane -Z
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind-key y set-window-option synchronize-panes \; display-message " 󰓦 Pane synchronization toggled "

# Reload configuration.
unbind r
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display-message " 󰑓 Config reloaded "

# Scrollback and status timing.
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5

# Vi-style copy mode.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Status line position and theme.
# Catppuccin Macchiato, matching the starship palette.
source-file -F "#{d:current_file}/themes/catppuccin_macchiato.conf"
set-option -g status-position bottom
set-option -g status on
set -g status-style "bg=#{@thm_overlay_0},fg=#{@thm_crust}"
set -g message-style "bg=#{@thm_maroon},fg=#{@thm_crust}"
set -g message-format '#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{?#{command_prompt},#{message}, #{message} }'
set -g pane-border-style "fg=#{@thm_overlay_0}"
set -g pane-active-border-style "fg=#{@thm_green}"
set -g mode-style "bg=#{@thm_yellow},fg=#{@thm_mantle}"
set -g status-left-length 60
set -g status-left "#[fg=#{@thm_crust},bg=#{@thm_overlay_0}]#[fg=#{@thm_crust},bg=#{@thm_mauve},bold] #S  #[fg=#{@thm_crust},bg=#{@thm_overlay_0}]"
set -g status-right-length 120
set -g status-right "#[fg=#{@thm_crust},bg=#{@thm_sky}] 󰼵 #{weather} #[fg=#{@thm_crust},bg=#{@thm_pink}] 󰥔 %H:%M #[fg=#{@thm_crust},bg=#{@thm_pink}] #[fg=#{@thm_crust},bg=#{@thm_pink}]󰃭 %Y-%m-%d #[fg=#{@thm_crust},bg=#{?#{==:#{user},root},#{@thm_red},#{@thm_peach}}]  #(whoami)@#H #[fg=#{@thm_crust},bg=#{@thm_overlay_0}]"
set -g window-status-format "#[fg=#{@thm_crust}] 󰈚 #I:#W "
set -g window-status-bell-style "fg=#{@thm_crust},bg=#{@thm_overlay_0}"
set -g window-status-activity-style "fg=#{@thm_crust},bg=#{@thm_overlay_0}"
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_green},bold] 󰈚 #I:#W #[default]"
set -g window-status-separator ""

set -g @tmux-weather-format '%l+%C+%t+%h+%w'
set -g @plugin 'xamut/tmux-weather'

# TPM-managed plugins are installed alongside this submodule.
run "$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm"
