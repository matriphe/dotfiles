# Basic Tmux configuration.

# Use Ctrl-a as the prefix.
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support and keep useful scrollback.
set-option -g mouse on
set-option -g history-limit 10000

# Improve terminal and key handling.
set-option -g default-terminal "screen-256color"
set-option -sg escape-time 0

# Start window and pane numbering at one.
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Reload this configuration with the prefix followed by r.
bind-key r source-file "$TMUX_CONFIG" \; display-message "Tmux configuration reloaded"
